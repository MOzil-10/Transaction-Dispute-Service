server:
  port: 8087

spring:
  application:
    name: dispute

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

logging:
  level:
    root: INFO
    com.transaction.dispute: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG