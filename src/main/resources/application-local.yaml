server:
  port: 8087

spring:
  application:
    name: dispute

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    # Local/docker loads BOTH the schema migrations and the local-only seed data.
    # Production uses only the default classpath:db/migration (no seed).
    locations: classpath:db/migration,classpath:db/seed

aws:
  region: ${AWS_REGION:af-south-1}
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  sqs:
    dispute-queue-url: ${AWS_SQS_DISPUTE_QUEUE_URL}
    endpoint-override: ${AWS_SQS_ENDPOINT_OVERRIDE:#{null}}

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: ${JWT_EXPIRATION:86400000}
    cors:
      # Comma-separated browser origins allowed to call the API. Defaults cover the Vite dev
      # server (5173) and the dockerised nginx frontend (3000). Override with CORS_ALLOWED_ORIGINS.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

logging:
  level:
    root: INFO
    com.transaction.dispute: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
